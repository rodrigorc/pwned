[package]
name = "pwned"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", features = ["gzip", "deflate"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.6.1", features = ["derive"] }
sha1 = "0.11.0"
passterm = "2.1.0"
progress_bar = "1.5.2"
anyhow = "1.0.104"
flate2 = "1.1.10"
env_logger = "0.11.11"
log = "0.4.34"
bytes = "1.12.1"
http = "1.5.0"
