[package]
name = "pwned"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Rodrigo Rivas Costa <rodrigorivascosta@gmail.com>"]
description = "HaveIBeenPwned client"
readme = "README.md"
repository = "https://github.com/rodrigorc/pwned"

[workspace]
members = ["pwned-core"]

[dependencies]
pwned-core = { path = "pwned-core", version = "0.1.0" }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.6.1", features = ["derive"] }
passterm = "2.1.0"
progress_bar = "1.5.2"
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.34"
directories = "6.0.0"
csv = "1.4.0"
